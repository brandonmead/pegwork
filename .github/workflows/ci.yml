name: CI

# Runs on pull_request (never pull_request_target), so a fork's PR gets a read-only token and no
# repository secrets. No step uses secrets.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - run: composer lint

  schema:
    name: JSON Schema fixture agreement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - run: composer schema-fixtures

  module-boundary:
    name: Module boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - run: bash bin/check-module-boundary.sh modules tests/fixtures/modules

  js:
    name: JS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # npm 10 fails to resolve the Vitest peer set (arborist edgesOut bug); the lockfile is npm 11.
      - run: npm install -g npm@11.20.0

      - run: npm ci

      - run: npm run lint:js

      - run: npm run build

      # Filters view module: at most 10 KB gzipped (docs/phase-2-design.md section 10).
      - run: npm run check:size

      - run: npm run test:unit

  test:
    name: Test (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        wp: ['6.7', 'latest']
        # PHP 8.5 runs against WordPress latest only. WordPress 6.7 predates PHP 8.5 and its own core
        # code raises 8.5 deprecations (a null array offset in WP_Block_Type_Registry), which the
        # suite turns into errors. That leg would only ever test core, so it is left out rather than
        # kept as a continue-on-error job that is always red.
        include:
          - php: '8.5'
            wp: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Install subversion
        run: sudo apt-get update -q && sudo apt-get install -y -q subversion

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 "$WP_VERSION"
        env:
          WP_VERSION: ${{ matrix.wp }}

      - name: Run tests
        run: composer test
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

  # The suite is split into two Playwright shards (whole spec files; specs are self-contained and
  # reset their own state). Each shard runs on its own runner with its own wp-env site.
  e2e:
    name: E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm install -g npm@11.20.0

      - run: npm ci

      - run: npm run build

      # The plugin loads vendor/autoload.php; wp-env mounts this checkout, so it must exist.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-dev --no-interaction --no-progress

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # WordPress latest on PHP 8.2 in Docker; .wp-env.json maps the plugin and the sifg mu-plugin.
      - name: Start wp-env
        run: npx wp-env start

      - name: Run E2E specs
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            !test-results/.auth/
          retention-days: 7
          if-no-files-found: ignore

  plugin-zip:
    name: Release zip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm install -g npm@11.20.0

      - run: npm ci

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      # Builds dist/pegwork.zip from a clean export with production dependencies only, and fails if a
      # dev file or dev package would ship.
      - run: bash bin/build-zip.sh

      - name: List zip contents
        run: unzip -Z1 dist/pegwork.zip
