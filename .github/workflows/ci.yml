name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - run: composer lint

  schema:
    name: JSON Schema fixture agreement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - run: composer schema-fixtures

  module-boundary:
    name: Module boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: bash bin/check-module-boundary.sh modules tests/fixtures/modules

  js:
    name: JS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm 10 fails to resolve the Vitest peer set (arborist edgesOut bug); the lockfile is npm 11.
      - run: npm install -g npm@11.20.0

      - run: npm ci

      - run: npm run lint:js

      - run: npm run build

      # Filters view module: at most 10 KB gzipped (docs/phase-2-design.md section 10).
      - run: npm run check:size

      - run: npm run test:unit

  test:
    name: Test (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        wp: ['6.7', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Install subversion
        run: sudo apt-get update -q && sudo apt-get install -y -q subversion

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 ${{ matrix.wp }}

      - name: Run tests
        run: composer test
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install -g npm@11.20.0

      - run: npm ci

      - run: npm run build

      # The plugin loads vendor/autoload.php; wp-env mounts this checkout, so it must exist.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer install --no-dev --no-interaction --no-progress

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # WordPress latest on PHP 8.2 in Docker; .wp-env.json maps the plugin and the sifg mu-plugin.
      - name: Start wp-env
        run: npx wp-env start

      - name: Run E2E specs
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            !test-results/.auth/
          retention-days: 7
          if-no-files-found: ignore
